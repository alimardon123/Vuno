<?xml version="1.0" encoding="utf-8"?>
<!-- Vuno logo — two overlapping rounded shapes forming one mark.
     Represents human + agent as colleagues in one organization.
     Mustard/gold on transparent background. -->
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" xml:space="preserve">
  <defs>
    <linearGradient id="vuno-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C9962F"/>
      <stop offset="100%" stop-color="#A67C00"/>
    </linearGradient>
  </defs>
  <!-- Left shape (human) — a rounded "V" stroke -->
  <path d="M 6 8 L 12 24 L 16 14 L 12 8 Z" fill="url(#vuno-grad)" opacity="0.7"/>
  <!-- Right shape (agent) — a mirrored rounded "V" forming an "M" with the left -->
  <path d="M 26 8 L 20 24 L 16 14 L 20 8 Z" fill="url(#vuno-grad)"/>
  <!-- Center dot — the shared space / event spine where they meet -->
  <circle cx="16" cy="14" r="2" fill="#C9962F"/>
</svg>
